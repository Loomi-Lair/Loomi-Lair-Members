name: PR 验证

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: 验证成员数据
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base commit
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR changes
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "## 🔍 PR 变更验证" >> "$GITHUB_STEP_SUMMARY"
          node scripts/validate-pr.js
          echo "✅ PR 变更验证通过！" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate all member files
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🔍 完整性验证" >> "$GITHUB_STEP_SUMMARY"
          npm run validate
          echo "✅ 所有成员文件验证通过！" >> "$GITHUB_STEP_SUMMARY"

      - name: Test build
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🔨 构建测试" >> "$GITHUB_STEP_SUMMARY"
          npm run build
          echo "✅ 构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📊 统计信息" >> "$GITHUB_STEP_SUMMARY"
          MEMBER_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/members.json', 'utf8')).length)")
          echo "- 总成员数：${MEMBER_COUNT} 人" >> "$GITHUB_STEP_SUMMARY"
